name: CI Guards - Mock Data Prevention

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  mock-data-check:
    name: Check for Mock Data
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run mock data check
      run: node scripts/check-mock-data.js
      
    - name: Check for remaining mock data tokens
      run: |
        echo "Checking for remaining mock data tokens..."
        if grep -r "mock" apps/web/src --include="*.ts" --include="*.tsx" | grep -v ".test." | grep -v ".spec." | grep -v ".mock."; then
          echo "❌ Mock data tokens found in production code"
          exit 1
        fi
        echo "✅ No mock data tokens found"
        
  lighthouse-check:
    name: Lighthouse Performance Check
    runs-on: ubuntu-latest
    needs: mock-data-check
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build application
      run: npm run build
      
    - name: Start application
      run: npm start &
      env:
        PORT: 3000
        
    - name: Wait for application to start
      run: sleep 10
      
    - name: Run Lighthouse CI
      run: |
        npm install -g @lhci/cli
        lhci autorun
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        
  feature-flags-check:
    name: Feature Flags Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Check feature flags configuration
      run: |
        echo "Checking feature flags configuration..."
        if [ ! -f "services/flags/prisma/schema.prisma" ]; then
          echo "❌ Feature flags schema not found"
          exit 1
        fi
        echo "✅ Feature flags schema found"
        
    - name: Validate feature flags seed data
      run: |
        echo "Validating feature flags seed data..."
        if [ ! -f "services/flags/prisma/seed.ts" ]; then
          echo "❌ Feature flags seed file not found"
          exit 1
        fi
        echo "✅ Feature flags seed file found"
        
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [mock-data-check, feature-flags-check]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run integration tests
      run: npm run test:integration
      
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [mock-data-check, lighthouse-check]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Install Playwright
      run: npx playwright install
      
    - name: Run E2E tests
      run: npm run test:e2e
      
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run security audit
      run: npm audit --audit-level moderate
      
    - name: Check for hardcoded secrets
      run: |
        echo "Checking for hardcoded secrets..."
        if grep -r "password\|secret\|key\|token" . --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" | grep -v "node_modules" | grep -v ".git" | grep -v "test" | grep -v "spec"; then
          echo "❌ Potential hardcoded secrets found"
          exit 1
        fi
        echo "✅ No hardcoded secrets found"
