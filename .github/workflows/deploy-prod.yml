name: Deploy Production

on:
  push:
    branches: [prod]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  deploy-infra:
    name: Deploy Production Infrastructure
    runs-on: ubuntu-latest
    environment: production
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ secrets.AWS_REGION || 'me-south-1' }}
          role-session-name: GitHubActions-Deploy-Prod
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Install CDK dependencies
        run: |
          cd infra
          pnpm install --frozen-lockfile
      
      - name: Bootstrap CDK (if needed)
        run: |
          cd infra
          pnpm cdk:bootstrap || true
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'me-south-1' }}
      
      - name: Synthesize CDK stacks
        run: |
          cd infra
          pnpm cdk:synth:prod
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'me-south-1' }}
      
      - name: Deploy CDK stacks
        run: |
          cd infra
          pnpm cdk:deploy:prod
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'me-south-1' }}

  deploy-api:
    name: Deploy Production API
    runs-on: ubuntu-latest
    needs: deploy-infra
    environment: production
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ secrets.AWS_REGION || 'me-south-1' }}
          role-session-name: GitHubActions-Deploy-Prod
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build packages
        run: pnpm build
      
      - name: Get ECR repository
        id: get-ecr
        run: |
          REPO=$(aws ecr describe-repositories --repository-names supplify-api-prod --query 'repositories[0].repositoryUri' --output text 2>/dev/null || echo "")
          if [ -z "$REPO" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "repository=$REPO" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Build and push Docker image
        if: steps.get-ecr.outputs.skip != 'true' && hashFiles('apps/api/Dockerfile') != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: supplify-api-prod
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ -f "apps/api/Dockerfile" ]; then
            docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f apps/api/Dockerfile apps/api
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          fi
      
      - name: Update ECS service
        if: steps.get-ecr.outputs.skip != 'true'
        env:
          ECS_CLUSTER: supplify-cluster-prod
          ECS_SERVICE: supplify-api-prod
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION || 'me-south-1' }} || echo "ECS service update skipped"

  deploy-web:
    name: Deploy Production Web
    runs-on: ubuntu-latest
    needs: deploy-infra
    environment: production
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ secrets.AWS_REGION || 'me-south-1' }}
          role-session-name: GitHubActions-Deploy-Prod
      
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build web app
        run: |
          cd apps/web
          pnpm install
          pnpm build
      
      - name: Get S3 bucket and CloudFront ID
        id: get-s3
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name Supplify-S3CloudFrontStack-prod --query 'Stacks[0].Outputs[?OutputKey==`BucketName`].OutputValue' --output text 2>/dev/null || echo "")
          CF_ID=$(aws cloudformation describe-stacks --stack-name Supplify-S3CloudFrontStack-prod --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' --output text 2>/dev/null || echo "")
          if [ -z "$BUCKET" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
            echo "cf_id=$CF_ID" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Deploy to S3 + CloudFront
        if: steps.get-s3.outputs.skip != 'true'
        env:
          S3_BUCKET: ${{ steps.get-s3.outputs.bucket }}
          CLOUDFRONT_ID: ${{ steps.get-s3.outputs.cf_id }}
        run: |
          if [ -d "apps/web/dist" ]; then
            aws s3 sync apps/web/dist s3://$S3_BUCKET --delete --region ${{ secrets.AWS_REGION || 'me-south-1' }}
            if [ ! -z "$CLOUDFRONT_ID" ]; then
              aws cloudfront create-invalidation \
                --distribution-id $CLOUDFRONT_ID \
                --paths "/*" \
                --region ${{ secrets.AWS_REGION || 'me-south-1' }} || echo "CloudFront invalidation skipped"
            fi
          else
            echo "No dist directory found, skipping web deployment"
          fi
