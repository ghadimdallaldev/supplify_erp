# Unit tests for API and web (Vitest, non-watch). E2E/Playwright is separate (pnpm e2e:playwright).
name: CI

on:
  push:
    branches: [dev, main, preprod, prod]
  pull_request:
    branches: [dev, main, preprod]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (API + web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      BILLING_GATEWAY: stub
      JWT_SECRET: test-jwt-secret
      IMPERSONATION_SECRET: test-impersonation-secret-for-api-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API unit tests (vitest run)
        run: pnpm test:api

      - name: Web unit tests (vitest run)
        run: pnpm test:web

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-failure-logs
          path: |
            apps/api/**/*.log
          if-no-files-found: ignore
          retention-days: 7
