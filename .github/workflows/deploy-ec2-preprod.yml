# Deploy preprod branch to EC2 (staging compose on server).
name: Deploy EC2 Pre-Production

on:
  push:
    branches: [preprod]
  workflow_dispatch:

concurrency:
  group: deploy-ec2-preprod
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy to EC2 (preprod)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 45m
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.EC2_DEPLOY_PATH || '/opt/supplify' }}"
            BRANCH="${{ secrets.EC2_DEPLOY_BRANCH || 'preprod' }}"
            cd "$DEPLOY_PATH"
            git fetch origin
            git checkout "$BRANCH"
            git pull origin "$BRANCH"
            sudo ./deploy/scripts/deploy-preprod.sh
            ./deploy/scripts/healthcheck.sh staging || true
