name: Promote release

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Target release branch
        required: true
        type: choice
        options:
          - preprod
          - prod

permissions:
  contents: write

jobs:
  promote:
    name: Promote and prune ${{ inputs.tier }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Promote release branch
        run: |
          git checkout dev
          node scripts/promote-release.mjs --tier ${{ inputs.tier }}
