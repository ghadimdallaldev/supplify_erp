name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build and push Docker images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: supplify
          IMAGE_TAG: ${{ github.sha }}
          NEXT_PUBLIC_API_GATEWAY_URL: ${{ vars.PUBLIC_URL }}/graphql
          NEXT_PUBLIC_KEYCLOAK_URL: ${{ vars.PUBLIC_URL }}/auth
          NEXT_PUBLIC_KEYCLOAK_REALM: Supplify
          NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: supplify-web
          NEXT_PUBLIC_CHAT_WS_URL: ${{ vars.PUBLIC_URL }}/chat
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY-api-gateway:$IMAGE_TAG -f apps/api-gateway/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY-api-gateway:$IMAGE_TAG

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY-web:$IMAGE_TAG \
            --build-arg NEXT_PUBLIC_API_GATEWAY_URL="$NEXT_PUBLIC_API_GATEWAY_URL" \
            --build-arg NEXT_PUBLIC_KEYCLOAK_URL="$NEXT_PUBLIC_KEYCLOAK_URL" \
            --build-arg NEXT_PUBLIC_KEYCLOAK_REALM="$NEXT_PUBLIC_KEYCLOAK_REALM" \
            --build-arg NEXT_PUBLIC_KEYCLOAK_CLIENT_ID="$NEXT_PUBLIC_KEYCLOAK_CLIENT_ID" \
            --build-arg NEXT_PUBLIC_CHAT_WS_URL="$NEXT_PUBLIC_CHAT_WS_URL" \
            -f apps/web/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY-web:$IMAGE_TAG

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY-catalog:$IMAGE_TAG -f services/catalog/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY-catalog:$IMAGE_TAG

      - name: Run database migrations
        run: |
          echo "Running database migrations..."
          # Add migration commands here

      - name: Deploy to ECS
        run: |
          echo "Deploying to ECS..."
          # Add ECS deployment commands here
          # aws ecs update-service --cluster supplify-cluster --service api-gateway --force-new-deployment

