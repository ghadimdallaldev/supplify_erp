name: Deploy

on:
  push:
    branches: [prod]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      deploy_type:
        description: 'Deployment type'
        required: true
        type: choice
        options:
          - infra
          - api
          - web
          - all

jobs:
  deploy-infra:
    name: Deploy Infrastructure with CDK
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_type == 'infra' || github.event.inputs.deploy_type == 'all'))
    environment: production
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: me-south-1
          role-session-name: GitHubActions-Deploy
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Install CDK dependencies
        run: |
          cd infra
          pnpm install
      
      - name: Bootstrap CDK
        run: pnpm cdk:bootstrap
        env:
          AWS_ACCOUNT_ID: 302428338355
          AWS_REGION: me-south-1
      
      - name: Synthesize CDK stacks
        run: pnpm cdk:synth
      
      - name: Deploy CDK stacks
        run: pnpm cdk:deploy
        env:
          AWS_ACCOUNT_ID: 302428338355
          AWS_REGION: me-south-1

  deploy-api:
    name: Deploy API to ECS
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_type == 'api' || github.event.inputs.deploy_type == 'all'))
    environment: production
    needs: deploy-infra
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: me-south-1
          role-session-name: GitHubActions-Deploy
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build packages
        run: pnpm build
      
      - name: Build and push Docker image
        if: hashFiles('apps/api/Dockerfile') != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: supplify-api
          IMAGE_TAG: ${{ github.ref_name || 'latest' }}
        run: |
          if [ -f "apps/api/Dockerfile" ]; then
            docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f apps/api/Dockerfile .
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          else
            echo "No Dockerfile found for API, skipping Docker build"
          fi
      
      - name: Update ECS service
        env:
          ECS_CLUSTER: supplify-cluster
          ECS_SERVICE: supplify-api
          ECR_REPOSITORY: supplify-api
          IMAGE_TAG: ${{ github.ref_name || 'latest' }}
        run: |
          if [ -n "$ECS_CLUSTER" ] && [ -n "$ECS_SERVICE" ]; then
            aws ecs update-service \
              --cluster $ECS_CLUSTER \
              --service $ECS_SERVICE \
              --force-new-deployment \
              --region me-south-1
          else
            echo "ECS cluster and service not configured, skipping ECS deployment"
          fi

  deploy-web:
    name: Deploy Web to Vercel
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_type == 'web' || github.event.inputs.deploy_type == 'all'))
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest
      
      - name: Pull Vercel Environment Information
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./apps/web
