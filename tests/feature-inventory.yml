# Supplify feature inventory: each feature must have at least one linked test file.
# Run: pnpm test:coverage-map to fail if any feature has no tests.

features:
  - id: auth
    name: Authentication
    description: Login, logout, session persistence
    test_files:
      - e2e/suites/smoke/smoke.spec.ts
      - e2e/suites/critical_e2e/auth.spec.ts

  - id: tenant_registration
    name: Tenant registration
    description: Post-Keycloak organization setup for restaurant and supplier
    test_files:
      - api/registration-activation.spec.ts
      - e2e/suites/smoke/registration.spec.ts

  - id: billing_activation
    name: Billing account activation
    description: pending_activation lock, free plan checkout, billing API access while locked
    test_files:
      - api/registration-activation.spec.ts

  - id: free_trial_expiry
    name: Free Trial expiry
    description: Expired trial read-only GET, write 402, admin extend; unit tests in apps/api (billingAccess, billing-service, platform-settings)
    test_files:
      - api/registration-activation.spec.ts

  - id: rbac
    name: Role-based access control
    description: Tenant roles, workspace membership (one account per user), admin UI/API gates
    test_files:
      - e2e/suites/critical_e2e/rbac.spec.ts
      - api/admin-rbac.spec.ts

  - id: admin_impersonation
    name: Admin impersonation
    description: Platform admin view-as-tenant; cookie session, tenant scoping, billing guard, audit
    test_files:
      - api/admin-impersonation.spec.ts
      - e2e/suites/critical_e2e/admin-impersonation.spec.ts

  - id: receiving
    name: Receiving (goods-in)
    description: Restaurant receives DELIVERED orders; pending list and history
    test_files:
      - api/receiving-delivered.spec.ts
      - e2e/suites/critical_e2e/orders.spec.ts
      - e2e/suites/critical_e2e/receiving.spec.ts

  - id: order_timeline
    name: Order operations timeline
    description: Restaurant vs supplier timeline steps and DELIVERED status handling
    test_files:
      - e2e/suites/critical_e2e/orders.spec.ts
      - e2e/suites/critical_e2e/order-detail.spec.ts

  - id: orders
    name: Orders
    description: Create, submit, approve, fulfill, status updates, cancel/decline
    test_files:
      - e2e/suites/critical_e2e/orders.spec.ts
      - e2e/suites/critical_e2e/place-order.spec.ts
      - e2e/suites/critical_e2e/order-detail.spec.ts

  - id: catalog
    name: Catalog / Products
    description: Browse, search, add to cart, quick list; supplier add product
    test_files:
      - e2e/suites/critical_e2e/catalog.spec.ts

  - id: subscription_limits
    name: Subscription limits
    description: Plan limits enforced in UI and API
    test_files:
      - e2e/suites/critical_e2e/subscription-limits.spec.ts

  - id: navigation
    name: Navigation
    description: Sidebar, dashboard, quick lists
    test_files:
      - e2e/suites/nightly/nightly.spec.ts
      - e2e/suites/critical_e2e/quick-lists.spec.ts

  - id: cart
    name: Cart
    description: Cart page, place order, edit quantities
    test_files:
      - e2e/suites/critical_e2e/orders.spec.ts
      - e2e/suites/critical_e2e/catalog.spec.ts
      - e2e/suites/critical_e2e/place-order.spec.ts

  - id: promotions_deals
    name: Supplier deals & promotions
    description: Restaurant deal discovery, supplier deal CRUD, boosts, admin approvals; plan gates (supplier_deals, promotions)
    test_files:
      - api/promotions-deals-gates.spec.ts
      - e2e/suites/critical_e2e/deals-promotions.spec.ts

  - id: fulfillment
    name: Supplier fulfillment
    description: Supplier fulfillment panel, dispatch, routes
    test_files:
      - e2e/suites/critical_e2e/fulfillment.spec.ts
      - e2e/suites/critical_e2e/orders.spec.ts

  - id: invoices
    name: Invoices & payments
    description: Restaurant and supplier invoice views and payment UI
    test_files:
      - e2e/suites/critical_e2e/invoices.spec.ts

  - id: quotes
    name: Quote requests
    description: Restaurant quote requests and supplier quote inbox
    test_files:
      - e2e/suites/critical_e2e/quotes.spec.ts

  - id: contract_pricing
    name: Contract pricing
    description: Negotiated restaurant-supplier contract prices
    test_files:
      - e2e/suites/critical_e2e/contract-pricing.spec.ts

  - id: settings_onboarding
    name: Settings & onboarding
    description: Restaurant and supplier settings / onboarding hubs
    test_files:
      - e2e/suites/critical_e2e/settings.spec.ts

  - id: inventory
    name: Inventory
    description: Restaurant and supplier inventory / waste surfaces
    test_files:
      - e2e/suites/critical_e2e/inventory.spec.ts

  - id: chat
    name: Chat
    description: Tenant messaging between restaurant and supplier
    test_files:
      - e2e/suites/critical_e2e/chat.spec.ts

  - id: reservations
    name: Reservations
    description: Restaurant reservations and public portal
    test_files:
      - e2e/suites/critical_e2e/reservations.spec.ts

  - id: staff
    name: Staff HR
    description: Staff scheduling and self-service surfaces
    test_files:
      - e2e/suites/critical_e2e/staff.spec.ts

  - id: driver
    name: Driver deliveries
    description: Driver delivery list and status updates
    test_files:
      - e2e/suites/critical_e2e/driver.spec.ts

  - id: consumer_ordering
    name: Consumer B2C ordering
    description: Public storefront, menu, track, account
    test_files:
      - e2e/suites/smoke/consumer-ordering.spec.ts

  - id: admin_platform
    name: Admin platform
    description: Admin overview, tenants, plans, flags
    test_files:
      - e2e/suites/critical_e2e/admin-platform.spec.ts
      - e2e/suites/critical_e2e/admin-impersonation.spec.ts
