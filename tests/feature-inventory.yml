# Supplify feature inventory: each feature must have at least one linked test file.
# Run: pnpm test:coverage-map to fail if any feature has no tests.

features:
  - id: auth
    name: Authentication
    description: Login, logout, session persistence
    test_files:
      - e2e/suites/smoke/smoke.spec.ts
      - e2e/suites/critical_e2e/auth.spec.ts

  - id: tenant_registration
    name: Tenant registration
    description: Post-Keycloak organization setup for restaurant and supplier
    test_files:
      - api/registration-activation.spec.ts

  - id: billing_activation
    name: Billing account activation
    description: pending_activation lock, free plan checkout, billing API access while locked
    test_files:
      - api/registration-activation.spec.ts

  - id: free_trial_expiry
    name: Free Trial expiry
    description: Expired trial read-only GET, write 402, admin extend; unit tests in apps/api (billingAccess, billing-service, platform-settings)
    test_files:
      - api/registration-activation.spec.ts

  - id: rbac
    name: Role-based access control
    description: Tenant roles, workspace membership (one account per user), admin UI/API gates
    test_files:
      - e2e/suites/critical_e2e/rbac.spec.ts
      - api/admin-rbac.spec.ts

  - id: admin_impersonation
    name: Admin impersonation
    description: Platform admin view-as-tenant; cookie session, tenant scoping, billing guard, audit
    test_files:
      - api/admin-impersonation.spec.ts

  - id: receiving
    name: Receiving (goods-in)
    description: Restaurant receives DELIVERED orders; pending list and history
    test_files:
      - api/receiving-delivered.spec.ts
      - e2e/suites/critical_e2e/orders.spec.ts

  - id: order_timeline
    name: Order operations timeline
    description: Restaurant vs supplier timeline steps and DELIVERED status handling
    test_files:
      - e2e/suites/critical_e2e/orders.spec.ts

  - id: orders
    name: Orders
    description: Create, submit, approve, fulfill, status updates, cancel/decline
    test_files:
      - e2e/suites/critical_e2e/orders.spec.ts

  - id: catalog
    name: Catalog / Products
    description: Browse, search, add to cart, quick list; supplier add product
    test_files:
      - e2e/suites/critical_e2e/catalog.spec.ts

  - id: subscription_limits
    name: Subscription limits
    description: Plan limits enforced in UI and API
    test_files:
      - e2e/suites/critical_e2e/subscription-limits.spec.ts

  - id: navigation
    name: Navigation
    description: Sidebar, dashboard, quick lists
    test_files:
      - e2e/suites/nightly/nightly.spec.ts

  - id: cart
    name: Cart
    description: Cart page, place order, edit quantities
    test_files:
      - e2e/suites/critical_e2e/orders.spec.ts
      - e2e/suites/critical_e2e/catalog.spec.ts

  - id: promotions_deals
    name: Supplier deals & promotions
    description: Restaurant deal discovery, supplier deal CRUD, boosts, admin approvals; plan gates (supplier_deals, promotions)
    test_files:
      - api/promotions-deals-gates.spec.ts
      - e2e/suites/critical_e2e/orders.spec.ts
