# Product Onboarding Schema
# Quick Add and Bulk Upload for supplier products

scalar DateTime
scalar JSON

# ============================================================================
# TYPES
# ============================================================================

type ProductImport {
  id: ID!
  supplierId: ID!
  status: String!
  fileKey: String!
  fileType: String!
  totalRows: Int!
  validRows: Int!
  invalidRows: Int!
  warnings: JSON
  errorReportKey: String
  errorReportUrl: String
  summary: JSON
  createdBy: String!
  reviewedBy: String
  createdAt: DateTime!
  updatedAt: DateTime!
  rows: [ProductImportRow!]
}

type ProductImportRow {
  id: ID!
  importId: ID!
  rowNumber: Int!
  data: JSON!
  status: String!
  errors: JSON
  warnings: JSON
  productId: ID
  createdAt: DateTime!
}

type PresignedUpload {
  uploadUrl: String!
  fileKey: String!
}

type TemplateDownload {
  downloadUrl: String!
  fileName: String!
}

type ImportExecutionResult {
  imported: Int!
  updated: Int!
  skipped: Int!
  total: Int!
}

# ============================================================================
# INPUTS
# ============================================================================

input QuickProductInput {
  sku: String!
  name: String!
  brand: String
  categoryId: ID!
  unit: String!
  packSize: String
  price: Float!
  currency: String
  minOrderQty: Int
  leadTimeDays: Int
  stockQty: Int
  description: String
  imageKeys: [String!]
}

input CreateProductImportInput {
  fileKey: String!
  fileType: String!  # xlsx | csv
}

# ============================================================================
# QUERIES & MUTATIONS
# ============================================================================

extend type Query {
  """
  Get product import by ID
  """
  productImport(id: ID!): ProductImport!
  
  """
  Get product import rows with pagination
  """
  productImportRows(
    importId: ID!
    status: String
    page: Int = 1
    pageSize: Int = 100
  ): [ProductImportRow!]!
  
  """
  Get my product imports
  """
  myProductImports(status: String): [ProductImport!]!
  
  """
  Get all product imports (admin only)
  """
  allProductImports(
    supplierId: ID
    status: String
    limit: Int = 50
  ): [ProductImport!]!
}

extend type Mutation {
  """
  Quick add a single product
  Enforces tier limits and feature flags
  """
  createProductQuick(input: QuickProductInput!): Product!
  
  """
  Download product upload template
  """
  downloadProductTemplate(format: String = "xlsx"): TemplateDownload!
  
  """
  Get presigned URL for file upload
  """
  getProductUploadUrl(fileName: String!, fileType: String!): PresignedUpload!
  
  """
  Create product import from uploaded file
  Triggers async validation
  """
  createProductImport(input: CreateProductImportInput!): ProductImport!
  
  """
  Approve product import (admin only)
  Triggers import execution
  """
  approveProductImport(id: ID!): ProductImport!
  
  """
  Reject product import (admin only)
  """
  rejectProductImport(id: ID!, reason: String): ProductImport!
  
  """
  Cancel product import
  """
  cancelProductImport(id: ID!): ProductImport!
}

