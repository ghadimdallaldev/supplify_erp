# Sponsored Visibility & Promotions Schema

scalar DateTime
scalar JSON

# ============================================================================
# ENUMS
# ============================================================================

enum PromotionStatus {
  PENDING_APPROVAL
  ACTIVE
  PAUSED
  ENDED
  REJECTED
  BUDGET_EXHAUSTED
}

enum PromotionType {
  SPONSORED_VISIBILITY
  DISCOUNT
  FEATURED_PLACEMENT
}

enum TargetType {
  PRODUCT
  CATEGORY
  SUPPLIER
}

enum BillingModel {
  CPM
  CPC
  HYBRID
}

# ============================================================================
# TYPES
# ============================================================================

type Promotion {
  id: ID!
  supplierId: ID!
  type: PromotionType!
  name: String!
  description: String
  status: PromotionStatus!
  billingModel: BillingModel!
  
  startDate: DateTime!
  endDate: DateTime!
  
  dailyBudgetUSD: Float!
  totalBudgetUSD: Float!
  spentUSD: Float!
  cpmUSD: Float!
  cpcUSD: Float
  
  targetType: TargetType!
  targetIds: [ID!]!
  keywords: [String!]!
  
  priorityScore: Float!
  isFeatured: Boolean!
  
  impressions: Int!
  clicks: Int!
  ctr: Float!
  orders: Int!
  revenue: Float!
  
  createdAt: DateTime!
  updatedAt: DateTime!
}

type PromotionApproval {
  id: ID!
  promotionId: ID!
  adminId: ID!
  action: String!
  note: String
  previousStatus: String
  newStatus: String
  metadata: JSON
  createdAt: DateTime!
}

type PromotionAnalytics {
  promotion: Promotion!
  dailyStats: [DailyStat!]!
  eventSummary: JSON!
  roi: Float!
}

type DailyStat {
  date: DateTime!
  impressions: Int!
  clicks: Int!
  ctr: Float!
  spentUSD: Float!
  orders: Int!
  revenue: Float!
}

type SponsoredProduct {
  product: Product!
  isSponsored: Boolean!
  sponsorSupplierId: ID
  promotionId: ID
}

# ============================================================================
# INPUTS
# ============================================================================

input CreatePromotionInput {
  name: String!
  description: String
  targetType: TargetType!
  targetIds: [ID!]!
  dailyBudgetUSD: Float!
  totalBudgetUSD: Float!
  startDate: DateTime!
  endDate: DateTime!
  billingModel: BillingModel!
  cpmUSD: Float
  cpcUSD: Float
  keywords: [String!]
  priorityScore: Float
}

input UpdatePromotionInput {
  promotionId: ID!
  name: String
  description: String
  dailyBudgetUSD: Float
  totalBudgetUSD: Float
  endDate: DateTime
  status: PromotionStatus
  keywords: [String!]
}

input ApprovePromotionInput {
  promotionId: ID!
  note: String
}

input RejectPromotionInput {
  promotionId: ID!
  note: String!
}

# ============================================================================
# QUERIES & MUTATIONS
# ============================================================================

extend type Query {
  """
  Get all promotions for a supplier
  """
  myPromotions(status: PromotionStatus): [Promotion!]!
  
  """
  Get promotion by ID
  """
  promotion(id: ID!): Promotion!
  
  """
  Get promotion analytics
  """
  promotionAnalytics(id: ID!, days: Int = 30): PromotionAnalytics!
  
  """
  Get active campaigns (admin only)
  """
  activeCampaigns(supplierId: ID, limit: Int = 50): [Promotion!]!
  
  """
  Get pending approvals (admin only)
  """
  pendingPromotionApprovals: [Promotion!]!
  
  """
  Get blended search results with sponsored products first
  """
  searchProductsWithSponsored(
    categoryId: ID
    query: String
    supplierId: ID
    includeSponsored: Boolean = true
    first: Int = 50
  ): ProductConnection!
}

extend type Mutation {
  """
  Create a new promotion campaign
  Requires Pro or Premium tier
  """
  createPromotion(input: CreatePromotionInput!): Promotion!
  
  """
  Update promotion (before approval or if paused)
  """
  updatePromotion(input: UpdatePromotionInput!): Promotion!
  
  """
  Pause promotion
  """
  pausePromotion(id: ID!): Promotion!
  
  """
  Resume paused promotion
  """
  resumePromotion(id: ID!): Promotion!
  
  """
  Approve promotion (admin only)
  """
  approvePromotion(input: ApprovePromotionInput!): Promotion!
  
  """
  Reject promotion (admin only)
  """
  rejectPromotion(input: RejectPromotionInput!): Promotion!
  
  """
  Log impression (called when product becomes visible)
  """
  logPromotionImpression(promotionId: ID!, productId: ID!): Boolean!
  
  """
  Log click (called when sponsored product clicked)
  """
  logPromotionClick(promotionId: ID!, productId: ID!): Boolean!
  
  """
  Log conversion (called when order placed from sponsored product)
  """
  logPromotionConversion(promotionId: ID!, orderId: ID!, revenue: Float!): Boolean!
}

