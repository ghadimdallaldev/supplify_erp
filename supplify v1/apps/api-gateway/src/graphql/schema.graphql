type DashboardKpis {
  activeOrders: Int!
  monthlySpend: Float!
  lowStockCount: Int!
  loyaltyPoints: Int!
}

type OrderSummary {
  id: ID!
  supplierName: String!
  total: Float!
  status: String!
  createdAt: String!
}

type InventorySummary {
  totalItems: Int!
  totalValue: Float!
  lowStock: Int!
  outOfStock: Int!
}

type InventoryActivity {
  itemId: ID!
  change: Int!
  reason: String!
  at: String!
  orderId: ID
}

type LoyaltyWalletDTO {
  supplierId: ID!
  supplierName: String!
  points: Int!
  redeemRate: Float!
  earnRate: Float!
}

type LoyaltyProgram {
  id: ID!
  supplierId: ID!
  name: String!
  active: Boolean!
  earnRate: Float!
  redeemRate: Float!
  minRedeem: Int!
}

type RestaurantSupplier {
  id: ID!
  restaurantId: ID!
  supplierId: ID!
  supplierName: String!
  pinned: Boolean!
  featured: Boolean!
  createdAt: String!
}

extend type Query {
  restaurantDashboardKpis: String!
  recentOrders(limit: Int = 10): String!
  orders: String!
  inventorySummary: String!
  recentInventoryActivity(hours: Int = 24): String!
  myLoyaltyWallets: String!
  loyaltyPrograms: String!
  restaurantSuppliers: String!
  invoices(userId: String!, userRole: String!, status: String): String!
  invoiceStats(userId: String!, userRole: String!): String!
  featureFlags: String!
  evaluateFeatureFlag(flagKey: String!, orgType: String, orgId: String, userId: String): String!
  
  # Multi-tenant order queries
  myOrders(filter: OrderFilter, pagination: PageInput): OrderConnection!
  order(id: ID!): Order!
}

extend type Mutation {
  placeOrder(input: PlaceOrderInput!): String!
  redeemLoyaltyPoints(supplierId: ID!, points: Int!, orderId: ID!): Boolean!
  addSupplier(supplierId: ID!): String!
  pinSupplier(supplierId: ID!, pinned: Boolean!): String!
  featureSupplier(supplierId: ID!, featured: Boolean!): String!
  createInvoice(input: CreateInvoiceInput!): String!
  updateInvoiceStatus(invoiceId: ID!, status: String!, amount: Float, method: String): String!
  generateInvoicePDF(invoiceId: ID!): String!
  
  # Multi-tenant order mutations
  placeOrderMultiTenant(input: PlaceOrderInput!, idempotencyKey: String!): [Order!]!
  supplierAcknowledge(orderId: ID!, idempotencyKey: String!): Order!
  supplierSetPreparing(orderId: ID!, note: String, idempotencyKey: String!): Order!
  supplierDispatch(orderId: ID!, carrier: String, driverName: String, driverPhone: String, etaAt: String, idempotencyKey: String!): Order!
  supplierMarkDelivered(orderId: ID!, proofUrl: String, idempotencyKey: String!): Order!
  cancelOrder(orderId: ID!, reason: String!, idempotencyKey: String!): Order!
}

input CartItemInput {
  supplierProductId: String!
  restaurantItemId: String
  qtyOrderedBase: Int!
  uomBase: String!
  unitPrice: Float!
  notes: String
}

input DeliveryWindowInput {
  startTime: String
  endTime: String
  date: String
}

input LoyaltyRedemptionInput {
  supplierId: String!
  points: Int!
}

input PlaceOrderInput {
  items: [CartItemInput!]!
  deliveryAddress: String!
  deliveryWindow: DeliveryWindowInput
  notes: String
  loyaltyRedemptions: [LoyaltyRedemptionInput!]
}

input OrderFilter {
  status: String
  supplierId: String
  restaurantId: String
  dateFrom: String
  dateTo: String
}

input PageInput {
  page: Int = 1
  limit: Int = 20
}

type OrderConnection {
  nodes: [Order!]!
  meta: PageMeta!
}

type PageMeta {
  page: Int!
  limit: Int!
  total: Int!
  totalPages: Int!
}

type Order {
  id: ID!
  clientId: String!
  restaurantId: String!
  supplierId: String!
  status: String!
  subtotal: Float!
  discount: Float!
  tax: Float!
  shipping: Float!
  totalNet: Float!
  currency: String!
  deliveryAddress: String!
  notes: String
  placedAt: String!
  createdAt: String!
  updatedAt: String!
  items: [OrderItem!]!
  events: [OrderEvent!]!
}

type OrderItem {
  id: ID!
  clientId: String!
  orderId: String!
  supplierProductId: String!
  restaurantItemId: String
  qtyOrderedBase: Int!
  qtyDeliveredBase: Int!
  uomBase: String!
  unitPrice: Float!
  lineTotal: Float!
  meta: String
  createdAt: String!
}

type OrderEvent {
  id: ID!
  clientId: String!
  orderId: String!
  type: String!
  payload: String
  createdAt: String!
}

input CreateInvoiceInput {
  orderId: String!
  restaurantId: String!
  supplierId: String!
  issueDate: String
  dueDate: String
  notes: String
}
