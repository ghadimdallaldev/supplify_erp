type Conversation {
  id: ID!
  restaurantId: ID!
  supplierId: ID!
  status: String!
  lastMessageAt: DateTime!
  messages: [Message!]!
  unreadCount: Int!
}

type Message {
  id: ID!
  conversationId: ID!
  senderId: ID!
  senderType: String!
  messageType: String!
  content: String!
  metadata: JSON
  isEdited: Boolean!
  isDeleted: Boolean!
  createdAt: DateTime!
  readReceipts: [ReadReceipt!]!
}

type ReadReceipt {
  userId: ID!
  readAt: DateTime!
}

type OnlineStatus {
  userId: ID!
  isOnline: Boolean!
  lastSeenAt: DateTime!
}

extend type Query {
  myConversations: [Conversation!]!
  conversation(id: ID!): Conversation
  conversationBetween(restaurantId: ID!, supplierId: ID!): Conversation
  conversationMessages(conversationId: ID!, limit: Int, offset: Int): [Message!]!
  onlineStatus(userId: ID!): OnlineStatus
}

extend type Mutation {
  startConversation(restaurantId: ID!, supplierId: ID!): Conversation!
  sendMessage(conversationId: ID!, content: String!, type: String, metadata: JSON): Message!
  editMessage(messageId: ID!, content: String!): Message!
  deleteMessage(messageId: ID!): Boolean!
  markAsRead(messageId: ID!): Boolean!
}

