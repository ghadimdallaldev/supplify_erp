type SearchResult {
  hits: [SearchHit!]!
  total: Int!
}

type SearchHit {
  id: ID!
  name: String!
  description: String
  brand: String
  category: String
  price: Float
  score: Float
  highlights: JSON
}

type Suggestion {
  text: String!
  score: Float!
}

extend type Query {
  search(query: String!, type: String!, filters: JSON): SearchResult!
  searchSuggestions(query: String!, type: String!): [Suggestion!]!
}

