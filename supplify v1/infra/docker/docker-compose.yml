services:
  postgres:
    image: postgres:16-alpine
    container_name: supplify-postgres
    environment:
      POSTGRES_DB: supplify
      POSTGRES_USER: supplify
      POSTGRES_PASSWORD: supplify_dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U supplify']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - supplify-network

  redis:
    image: redis:7-alpine
    container_name: supplify-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - supplify-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: supplify-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: supplify
      RABBITMQ_DEFAULT_PASS: supplify_dev_password
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - supplify-network

  localstack:
    image: localstack/localstack:latest
    container_name: supplify-localstack
    environment:
      SERVICES: s3,secretsmanager
      DEBUG: 1
      DATA_DIR: /tmp/localstack/data
      AWS_DEFAULT_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - '4566:4566'
    volumes:
      - localstack_data:/tmp/localstack
      - ./init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - supplify-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  localstack_data:

networks:
  supplify-network:
    driver: bridge

