# Infra + API + web behind nginx (full Docker stack).
# Native dev (hot reload):  pnpm setup && pnpm dev
# Infra only:               pnpm local:infra
# Full Docker:              pnpm dev:docker  or  scripts/run-local.cmd up

name: supplify

x-api-environment: &api-environment
  NODE_ENV: ${NODE_ENV:-development}
  PORT: 4000
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-supplify}
  SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
  CONSUMER_AUTH_SECRET: ${CONSUMER_AUTH_SECRET:-${SESSION_SECRET:-dev-session-secret-change-me}}
  KEYCLOAK_BASE_URL: http://keycloak:8080
  KEYCLOAK_PUBLIC_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8180}
  KEYCLOAK_REALM: Supplify
  KEYCLOAK_CLIENT_ID: supplify-api
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-changeme}
  KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
  KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
  S3_BUCKET: ${S3_BUCKET:-supplify}
  S3_BUCKETS: ${S3_BUCKETS:-}
  S3_PUBLIC_READ: ${S3_PUBLIC_READ:-true}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  REDIS_URL: redis://redis:6379
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
  DATABASE_POOL_IDLE_TIMEOUT_MS: ${DATABASE_POOL_IDLE_TIMEOUT_MS:-600000}
  SLOW_REQUEST_MS: ${SLOW_REQUEST_MS:-800}
  IDLE_PERF_LOG_MS: ${IDLE_PERF_LOG_MS:-0}
  DB_KEEPALIVE_ENABLED: ${DB_KEEPALIVE_ENABLED:-false}
  DB_KEEPALIVE_INTERVAL_SECONDS: ${DB_KEEPALIVE_INTERVAL_SECONDS:-60}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
  WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:8081}
  CRONS_ENABLED: ${CRONS_ENABLED:-true}
  # CRON_OPERATIONAL_REMINDERS_INTERVAL_MS=86400000
  EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  EMAIL_LOG_ONLY: ${EMAIL_LOG_ONLY:-false}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Supplify}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@supplify.local}
  EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
  EMAIL_TEST_TO: ${EMAIL_TEST_TO:-}
  AUTH_EMAIL_OTP_ENABLED: ${AUTH_EMAIL_OTP_ENABLED:-true}
  AUTH_EMAIL_OTP_INTERNAL_SECRET: ${AUTH_EMAIL_OTP_INTERNAL_SECRET:-dev-email-otp-internal-secret}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-noreply@supplify.local}
  STAFF_PORTAL_BASE_URL: ${STAFF_PORTAL_BASE_URL:-http://localhost}

services:
  postgres:
    image: postgres:16-alpine
    container_name: supplify-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-supplify}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/db/init.sql:/docker-entrypoint-initdb.d/01-init-keycloak-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-supplify}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - supplify

  redis:
    image: redis:7-alpine
    container_name: supplify-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - supplify

  mailpit:
    image: axllent/mailpit:latest
    container_name: supplify-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped
    networks:
      - supplify

  minio:
    image: minio/minio:latest
    container_name: supplify-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - supplify

  minio-init:
    image: minio/mc:latest
    container_name: supplify-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./deploy/scripts/minio-init-buckets.sh:/scripts/minio-init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/scripts/minio-init-buckets.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-supplify}
      S3_BUCKETS: ${S3_BUCKETS:-}
      MINIO_PUBLIC_READ: ${MINIO_PUBLIC_READ:-true}
    restart: "no"
    networks:
      - supplify

  keycloak:
    build:
      context: .
      dockerfile: deploy/railway/keycloak/Dockerfile
      args:
        REALM_EXPORT_FILE: deploy/keycloak/realm-export.json
        REALM_IMPORT_FILENAME: Supplify-realm.json
    image: supplify-keycloak:24.0-otp
    container_name: supplify-keycloak
    environment:
      # Cap JVM heap for local dev (default Keycloak dev mode can exceed 1.5 GiB RSS)
      JAVA_OPTS_APPEND: ${KEYCLOAK_JAVA_OPTS_APPEND:--Xms256m -Xmx768m}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      AUTH_EMAIL_OTP_ENABLED: ${AUTH_EMAIL_OTP_ENABLED:-true}
      AUTH_EMAIL_OTP_DRIVER_BYPASS: ${AUTH_EMAIL_OTP_DRIVER_BYPASS:-true}
      AUTH_EMAIL_OTP_HMAC_SECRET: ${AUTH_EMAIL_OTP_HMAC_SECRET:-dev-email-otp-hmac-secret-change-me}
      SUPPLIFY_OTP_MAIL_URL: ${SUPPLIFY_OTP_MAIL_URL:-http://host.docker.internal:4000/api/internal/auth/otp/email}
      SUPPLIFY_OTP_MAIL_SECRET: ${SUPPLIFY_OTP_MAIL_SECRET:-dev-email-otp-internal-secret}
    command:
      - start
      - --import-realm
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/Supplify-realm.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - supplify

  keycloak-init:
    image: quay.io/keycloak/keycloak:24.0
    container_name: supplify-keycloak-init
    entrypoint:
      - /bin/bash
      - /scripts/keycloak-init.sh
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    volumes:
      - ./deploy/keycloak/realm-export.json:/import/realm-export.json:ro
      - ./deploy/scripts/keycloak-init.sh:/scripts/keycloak-init.sh:ro
    depends_on:
      keycloak:
        condition: service_started
    restart: "no"
    networks:
      - supplify

  migrate:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: supplify-migrate
    environment:
      <<: *api-environment
    entrypoint:
      - /bin/sh
      - -c
      - |
        node apps/api/scripts/run-migration.js || echo "WARN: partial SQL migrations"
        node --input-type=module -e "
        import { ensureReservationsSchema, ensureStaffAppSchema } from './apps/api/src/lib/migrator.js';
        try {
          await ensureStaffAppSchema();
          await ensureReservationsSchema();
          console.log('Runtime schema migrator finished');
        } catch (e) {
          console.warn('Runtime migrator warning:', e.message);
        }
        " || true
        node apps/api/scripts/sync-system-roles.mjs || echo "WARN: sync-system-roles"
        exit 0
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - supplify

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: supplify-api
    environment:
      <<: *api-environment
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      keycloak-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - supplify

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8180}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-Supplify}
    container_name: supplify-web
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - supplify

  nginx:
    profiles: ["full"]
    image: nginx:alpine
    container_name: supplify-nginx
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - supplify

networks:
  supplify:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  keycloak_data:
