# Infra + API + web behind nginx (full Docker stack).
# Native dev (hot reload):  pnpm setup && pnpm dev
# Infra only:               pnpm local:infra
# Full Docker:              pnpm dev:docker  or  scripts/run-local.cmd up

name: supplify

x-api-environment: &api-environment
  NODE_ENV: ${NODE_ENV:-development}
  PORT: 4000
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-supplify}
  SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
  KEYCLOAK_BASE_URL: http://keycloak:8080
  KEYCLOAK_PUBLIC_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8180}
  KEYCLOAK_REALM: Supplify
  KEYCLOAK_CLIENT_ID: supplify-api
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-changeme}
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-supplify}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  REDIS_URL: redis://redis:6379
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
  WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:8081}

services:
  postgres:
    image: postgres:16-alpine
    container_name: supplify-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-supplify}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/01-init-keycloak-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-supplify}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - supplify

  redis:
    image: redis:7-alpine
    container_name: supplify-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - supplify

  minio:
    image: minio/minio:latest
    container_name: supplify-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - supplify

  minio-init:
    image: minio/mc:latest
    container_name: supplify-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD 2>/dev/null; do sleep 2; done;
      mc mb local/${S3_BUCKET:-supplify} --ignore-existing;
      echo 'MinIO bucket ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    restart: "no"
    networks:
      - supplify

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: supplify-keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    command:
      - start-dev
      - --import-realm
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/Supplify-realm.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - supplify

  keycloak-init:
    image: quay.io/keycloak/keycloak:24.0
    container_name: supplify-keycloak-init
    entrypoint:
      - /bin/bash
      - -ec
      - |
        echo "Waiting for Keycloak..."
        for i in $$(seq 1 90); do
          if /opt/keycloak/bin/kcadm.sh config credentials \
            --server http://keycloak:8080 \
            --realm master \
            --user "$${KEYCLOAK_ADMIN}" \
            --password "$${KEYCLOAK_ADMIN_PASSWORD}" >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        if /opt/keycloak/bin/kcadm.sh get realms/Supplify >/dev/null 2>&1; then
          echo "Realm Supplify already exists"
          exit 0
        fi
        /opt/keycloak/bin/kcadm.sh create realms -f /import/realm-export.json
        echo "Realm Supplify created"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/keycloak/realm-export.json:/import/realm-export.json:ro
    depends_on:
      keycloak:
        condition: service_started
    restart: "no"
    networks:
      - supplify

  migrate:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: supplify-migrate
    environment:
      <<: *api-environment
    entrypoint:
      - /bin/sh
      - -c
      - |
        node apps/api/scripts/run-migration.js || echo "WARN: partial SQL migrations"
        node --input-type=module -e "
        import { ensureReservationsSchema, ensureStaffAppSchema } from './apps/api/src/lib/migrator.js';
        try {
          await ensureStaffAppSchema();
          await ensureReservationsSchema();
          console.log('Runtime schema migrator finished');
        } catch (e) {
          console.warn('Runtime migrator warning:', e.message);
        }
        " || true
        exit 0
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - supplify

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: supplify-api
    environment:
      <<: *api-environment
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      keycloak-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - supplify

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8180}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-Supplify}
    container_name: supplify-web
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - supplify

  nginx:
    profiles: ["full"]
    image: nginx:alpine
    container_name: supplify-nginx
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - supplify

networks:
  supplify:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  keycloak_data:
