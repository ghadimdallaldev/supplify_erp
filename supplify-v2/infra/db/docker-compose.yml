version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: supplify
      POSTGRES_USER: supplify
      POSTGRES_PASSWORD: supplify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - supplify-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - supplify-network

volumes:
  postgres_data:

networks:
  supplify-network:
    driver: bridge
