version: "3.9"

name: supplify-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: supplify-dev-postgres
    env_file: ./env/.env.dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supplify}
      POSTGRES_USER: ${POSTGRES_USER:-supplify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - supplify_dev_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supplify} -d ${POSTGRES_DB:-supplify} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    labels:
      - "autoheal=true"
    networks:
      - supplify_dev_net

  redis:
    image: redis:7-alpine
    container_name: supplify-dev-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - supplify_dev_net

  minio:
    image: minio/minio:latest
    container_name: supplify-dev-minio
    env_file: ./env/.env.dev
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - supplify_dev_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - supplify_dev_net

  minio-init:
    image: minio/mc:latest
    container_name: supplify-dev-minio-init
    env_file: ./env/.env.dev
    volumes:
      - ./scripts/minio-init-buckets.sh:/scripts/minio-init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/scripts/minio-init-buckets.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-supplify}
      S3_BUCKETS: ${S3_BUCKETS:-}
      MINIO_PUBLIC_READ: ${MINIO_PUBLIC_READ:-true}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - supplify_dev_net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: supplify-dev-keycloak
    env_file: ./env/.env.dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-supplify}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    command:
      - start-dev
      - --import-realm
    volumes:
      - supplify_dev_keycloak:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/Supplify-realm.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - supplify_dev_net

  keycloak-init:
    image: quay.io/keycloak/keycloak:24.0
    container_name: supplify-dev-keycloak-init
    env_file: ./env/.env.dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    entrypoint:
      - /bin/bash
      - /scripts/keycloak-init.sh
    volumes:
      - ./keycloak/realm-export.json:/import/realm-export.json:ro
      - ./scripts/keycloak-init.sh:/scripts/keycloak-init.sh:ro
    depends_on:
      keycloak:
        condition: service_started
    restart: "no"
    networks:
      - supplify_dev_net

  migrate:
    image: ${BACKEND_IMAGE:-supplify-backend:dev}
    container_name: supplify-dev-migrate
    env_file: ./env/.env.dev
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
    entrypoint:
      - /bin/sh
      - -c
      - |
        node apps/api/scripts/run-migration.js || { echo "SQL migrations failed"; exit 1; }
        node --input-type=module -e "
        import { ensureStaffAppSchema, ensureReservationsSchema } from './apps/api/src/lib/migrator.js';
        try {
          await ensureStaffAppSchema();
          await ensureReservationsSchema();
          console.log('Runtime schema migrators complete');
        } catch (e) {
          console.error('Runtime migrator failed:', e.message);
          process.exit(1);
        }
        "
        node apps/api/scripts/migrate-users-to-roles.js || { echo "Tenant role backfill failed"; exit 1; }
        node apps/api/scripts/sync-system-roles.mjs || { echo "System roles sync failed"; exit 1; }
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - supplify_dev_net

  backend:
    image: ${BACKEND_IMAGE:-supplify-backend:dev}
    container_name: supplify-dev-backend
    env_file: ./env/.env.dev
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${BACKEND_PORT:-4000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      SESSION_SECRET: ${SESSION_SECRET}
      CONSUMER_AUTH_SECRET: ${CONSUMER_AUTH_SECRET:-${SESSION_SECRET}}
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8180}
      KEYCLOAK_REALM: Supplify
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-supplify-api}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-changeme}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-supplify}
      S3_BUCKETS: ${S3_BUCKETS:-}
      S3_PUBLIC_READ: ${S3_PUBLIC_READ:-true}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      REDIS_URL: redis://redis:6379
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      DATABASE_POOL_IDLE_TIMEOUT_MS: ${DATABASE_POOL_IDLE_TIMEOUT_MS:-600000}
      SLOW_REQUEST_MS: ${SLOW_REQUEST_MS:-800}
      IDLE_PERF_LOG_MS: ${IDLE_PERF_LOG_MS:-500}
      DB_KEEPALIVE_ENABLED: ${DB_KEEPALIVE_ENABLED:-true}
      DB_KEEPALIVE_INTERVAL_SECONDS: ${DB_KEEPALIVE_INTERVAL_SECONDS:-60}
      CRONS_ENABLED: ${CRONS_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      keycloak-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    expose:
      - "${BACKEND_PORT:-4000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${BACKEND_PORT:-4000}/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    labels:
      - "autoheal=true"
    networks:
      - supplify_dev_net

  frontend:
    image: ${FRONTEND_IMAGE:-supplify-frontend:dev}
    container_name: supplify-dev-frontend
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    labels:
      - "autoheal=true"
    networks:
      - supplify_dev_net

  nginx:
    image: nginx:alpine
    container_name: supplify-dev-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    labels:
      - "autoheal=true"
    networks:
      - supplify_dev_net

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: supplify-dev-autoheal
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      AUTOHEAL_START_PERIOD: 30
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    container_name: supplify-dev-backup
    env_file: ./env/.env.dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supplify}
      POSTGRES_USER: ${POSTGRES_USER:-supplify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: ${BACKUP_DIR:-/opt/supplify/backups-dev}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_REMOTE_URL: ${BACKUP_REMOTE_URL:-}
    volumes:
      - ${BACKUP_DIR:-/opt/supplify/backups-dev}:/backups
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "apk add --no-cache bash tzdata >/dev/null 2>&1 || true;
       echo 'Backup container ready. Use ./deploy/scripts/backup-now.sh to trigger.';
       tail -f /dev/null"
    restart: unless-stopped
    networks:
      - supplify_dev_net

volumes:
  supplify_dev_pgdata:
  supplify_dev_minio:
  supplify_dev_keycloak:

networks:
  supplify_dev_net:
    driver: bridge
