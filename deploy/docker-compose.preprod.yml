version: "3.9"

name: supplify-preprod

services:
  postgres:
    image: postgres:16-alpine
    container_name: supplify-preprod-postgres
    env_file:
      - /opt/supplify/env/.env.preprod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supplify}
      POSTGRES_USER: ${POSTGRES_USER:-supplify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - supplify_preprod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supplify} -d ${POSTGRES_DB:-supplify} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    labels:
      - "autoheal=true"
    networks:
      - supplify_preprod_net

  backend:
    image: ${BACKEND_IMAGE:-supplify-backend:preprod}
    container_name: supplify-preprod-backend
    env_file:
      - /opt/supplify/env/.env.preprod
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${BACKEND_PORT:-3020}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3020}:${BACKEND_PORT:-3020}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${BACKEND_PORT:-3020}/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    labels:
      - "autoheal=true"
    networks:
      - supplify_preprod_net

  frontend:
    image: ${FRONTEND_IMAGE:-supplify-frontend:preprod}
    container_name: supplify-preprod-frontend
    env_file:
      - /opt/supplify/env/.env.preprod
    environment:
      NODE_ENV: production
      PORT: ${FRONTEND_PORT:-3021}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3021}:${FRONTEND_PORT:-3021}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${FRONTEND_PORT:-3021}/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    labels:
      - "autoheal=true"
    networks:
      - supplify_preprod_net

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: supplify-preprod-autoheal
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      AUTOHEAL_START_PERIOD: 30
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    container_name: supplify-preprod-backup
    env_file:
      - /opt/supplify/env/.env.preprod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supplify}
      POSTGRES_USER: ${POSTGRES_USER:-supplify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-supplify-preprod}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - /opt/supplify/backups-preprod:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: "echo 'Backup container ready. Use host scripts to trigger backups.'; exec tail -f /dev/null"
    restart: unless-stopped
    networks:
      - supplify_preprod_net

volumes:
  supplify_preprod_pgdata:

networks:
  supplify_preprod_net:
    driver: bridge
