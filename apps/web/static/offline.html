<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b21b6" />
    <title>Offline — Supplify</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        --brand: #5b21b6;
        --text: #1e0b3a;
        --muted: #8b7aaa;
        --bg: #f1f5f9;
        --surface: #ffffff;
        --border: #e2e8f0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
        font-family: Inter, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .card {
        width: min(100%, 24rem);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1.5rem;
        text-align: center;
        box-shadow: 0 8px 32px rgba(91, 33, 182, 0.08);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.5;
      }
      button {
        width: 100%;
        min-height: 2.75rem;
        border: none;
        border-radius: 0.625rem;
        background: var(--brand);
        color: #fff;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You&apos;re offline</h1>
      <p>
        Supplify needs an internet connection for orders, deliveries, and live updates. Check your
        connection and try again.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
