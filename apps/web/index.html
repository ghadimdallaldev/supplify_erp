<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5b21b6" />
    <!-- Fonts: preconnect + parallel <link> instead of a render-blocking CSS @import.
         A CSS @import waterfalls (app CSS → font CSS → font files); this loads the
         font stylesheet in parallel with app CSS. display=swap paints text immediately. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <meta name="description" content="Supplify — restaurant & F&B supplier marketplace for orders, fulfillment, receiving, and reservations." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Supplify" />
    <title>Supplify - Restaurant & F&B Supplier Marketplace</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(() => {
        const appEnv = '%VITE_APP_ENV%'
        const resetToken = '%VITE_CLIENT_STATE_RESET_TOKEN%'
        const markerKey = 'supplify.dev.client-state-reset-token'

        if (appEnv !== 'dev' || !resetToken || resetToken.startsWith('%VITE_')) return

        try {
          if (localStorage.getItem(markerKey) === resetToken) return
          localStorage.clear()
          sessionStorage.clear()
          localStorage.setItem(markerKey, resetToken)
        } catch {
          // Storage can be unavailable in private browsing; the app can still start.
        }

        if ('caches' in window) {
          void caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
