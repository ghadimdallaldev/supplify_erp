# Subscriptions & Entitlements Schema

scalar DateTime
scalar JSON

# ============================================================================
# TYPES
# ============================================================================

type FeatureFlags {
  analyticsAdvanced: Boolean!
  promotions: Boolean!
  recommendationsBoost: Boolean!
  loyaltyAdvanced: Boolean!
  apiAccess: Boolean!
  webhooks: Boolean!
  inventoryModule: Boolean!
  pinnedProducts: Boolean!
  prioritySupport: Boolean!
}

type LimitCaps {
  products: Int!
  promotionsActive: Int!
  pinnedPerSupplier: Int!
  favoriteLists: Int!
  users: Int!
  apiRateRps: Int!
  storageGB: Int!
}

type Entitlements {
  features: FeatureFlags!
  limits: LimitCaps!
}

type SubscriptionPlan {
  id: ID!
  code: String!
  name: String!
  description: String
  isActive: Boolean!
  entitlements: JSON!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type OrgSubscription {
  id: ID!
  orgId: ID!
  orgType: String!
  planCode: String!
  status: String!
  startsAt: DateTime!
  endsAt: DateTime
  trialEndsAt: DateTime
  entitlements: Entitlements!
  updatedBy: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type SubscriptionStats {
  totalSubscriptions: Int!
  activeSubscriptions: Int!
  byPlan: JSON!
  byOrgType: JSON!
  trialsEndingSoon: Int!
}

# ============================================================================
# INPUTS
# ============================================================================

input AssignSubscriptionInput {
  orgId: ID!
  orgType: String!
  planCode: String!
  trialDays: Int
  overrides: JSON
}

input UpdateSubscriptionInput {
  subscriptionId: ID!
  status: String
  planCode: String
  endsAt: DateTime
  overrides: JSON
}

# ============================================================================
# QUERIES & MUTATIONS
# ============================================================================

extend type Query {
  """
  Get my organization's entitlements
  Resolves by current user's org from JWT
  """
  myEntitlements(orgType: String!): Entitlements!
  
  """
  Get subscription for a specific org (admin only)
  """
  subscriptionForOrg(orgId: ID!, orgType: String!): OrgSubscription!
  
  """
  Get all subscription plans
  """
  subscriptionPlans: [SubscriptionPlan!]!
  
  """
  Get all org subscriptions (admin only)
  """
  allSubscriptions(
    orgType: String
    planCode: String
    status: String
  ): [OrgSubscription!]!
  
  """
  Get subscription statistics (admin only)
  """
  subscriptionStats: SubscriptionStats!
}

extend type Mutation {
  """
  Assign subscription to an org (admin only)
  """
  assignSubscription(input: AssignSubscriptionInput!): OrgSubscription!
  
  """
  Update subscription (admin only)
  """
  updateSubscription(input: UpdateSubscriptionInput!): OrgSubscription!
}

