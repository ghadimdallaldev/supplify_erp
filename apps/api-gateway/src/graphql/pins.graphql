# Pinned Products Schema
# Restaurant-scoped, supplier-scoped product pins

type PinnedProduct {
  id: ID!
  restaurantId: ID!
  supplierId: ID!
  productId: ID!
  sortIndex: Int!
  note: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

input PinProductInput {
  supplierId: ID!
  productId: ID!
  note: String
}

input UnpinProductInput {
  supplierId: ID!
  productId: ID!
}

input ReorderPinnedProductsInput {
  supplierId: ID!
  productIdsInOrder: [ID!]!
}

extend type Query {
  """
  Get all pinned products for a supplier
  """
  pinnedProducts(supplierId: ID!): [PinnedProduct!]!
  
  """
  Get supplier products with pins surfaced first
  Pinned products appear first (by sortIndex), then regular products
  """
  supplierProductsWithPins(
    supplierId: ID!
    search: String
    categoryId: ID
    first: Int = 50
    after: String
  ): ProductConnection!
}

extend type Mutation {
  """
  Pin a product to the top of supplier list
  If already pinned, updates note if provided
  """
  pinProduct(input: PinProductInput!): PinnedProduct!
  
  """
  Unpin a product
  """
  unpinProduct(input: UnpinProductInput!): Boolean!
  
  """
  Reorder pinned products via drag-drop
  productIdsInOrder should contain all pinned product IDs in new order
  """
  reorderPinnedProducts(input: ReorderPinnedProductsInput!): [PinnedProduct!]!
  
  """
  Update note/alias for a pinned product
  """
  updatePinNote(id: ID!, note: String!): PinnedProduct!
}

