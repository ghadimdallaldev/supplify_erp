# Feature Flags Schema

scalar JSON
scalar DateTime

# ============================================================================
# TYPES
# ============================================================================

type FeatureFlagDTO {
  key: String!
  name: String!
  description: String
  status: String!      # OFF | ON | ROLLOUT (effective for viewer's context)
  rolloutPct: Int
  reason: String       # e.g., "dependency_off", "override_force_off", "rollout_hit"
  dependencies: [String!]!
}

type FeatureFlag {
  id: ID!
  key: String!
  name: String!
  description: String
  enabledByDefault: Boolean!
  dependencies: [String!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type FlagRule {
  id: ID!
  flagId: ID!
  environment: String!
  status: String!
  rolloutPct: Int!
  targetOrgType: String
  targetOrgIds: [ID!]!
  conditions: JSON
  priority: Int!
  createdBy: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type FlagOverride {
  id: ID!
  flagId: ID!
  environment: String!
  orgType: String
  orgId: ID
  userId: ID
  forcedStatus: String!
  note: String
  createdBy: String
  createdAt: DateTime!
}

type FlagAudit {
  id: ID!
  flagId: ID
  action: String!
  actorId: String
  beforeJson: JSON
  afterJson: JSON
  createdAt: DateTime!
}

# ============================================================================
# INPUTS
# ============================================================================

input UpsertFlagInput {
  key: String!
  name: String!
  description: String
  enabledByDefault: Boolean
  dependencies: [String!]
}

input UpsertRuleInput {
  flagKey: String!
  environment: String!
  status: String!
  rolloutPct: Int
  targetOrgType: String
  targetOrgIds: [ID!]
  conditions: JSON
  priority: Int
}

input CreateOverrideInput {
  flagKey: String!
  environment: String!
  orgType: String
  orgId: ID
  userId: ID
  forcedStatus: String!
  note: String
}

# ============================================================================
# QUERIES & MUTATIONS
# ============================================================================

extend type Query {
  """
  Get all feature flags with effective status for current user's context
  """
  featureFlags: [FeatureFlagDTO!]!
  
  """
  Get a single feature flag's effective status
  """
  featureFlag(key: String!): FeatureFlagDTO!
  
  """
  Get all flags for an environment (admin only)
  """
  flagsForEnvironment(environment: String!): [FeatureFlag!]!
  
  """
  Get audit trail for a flag (admin only)
  """
  flagAudit(flagKey: String!, limit: Int = 50): [FlagAudit!]!
}

extend type Mutation {
  """
  Create or update a feature flag (admin only)
  """
  upsertFlag(input: UpsertFlagInput!): FeatureFlag!
  
  """
  Delete a feature flag (admin only)
  """
  deleteFlag(key: String!): Boolean!
  
  """
  Create or update a flag rule (admin only)
  """
  upsertRule(input: UpsertRuleInput!): FlagRule!
  
  """
  Delete a flag rule (admin only)
  """
  deleteRule(ruleId: ID!): Boolean!
  
  """
  Create an override (admin only)
  """
  createOverride(input: CreateOverrideInput!): FlagOverride!
  
  """
  Delete an override (admin only)
  """
  deleteOverride(overrideId: ID!): Boolean!
  
  """
  Invalidate flag cache (admin only)
  """
  invalidateFlagCache(flagKey: String!, environment: String!): Boolean!
}

