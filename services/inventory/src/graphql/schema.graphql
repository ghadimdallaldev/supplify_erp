scalar DateTime
scalar JSON

# ============================================================================
# ENUMS
# ============================================================================

enum StorageType {
  DRY
  CHILL
  FREEZE
  CHEMICAL
}

enum MovementType {
  RECEIPT
  ISSUE
  TRANSFER_OUT
  TRANSFER_IN
  WASTE
  RETURN
  ADJUSTMENT
}

enum BatchStatus {
  OK
  HOLD
  QUARANTINE
}

enum CountType {
  CYCLE
  FULL
}

enum CountStatus {
  SCHEDULED
  IN_PROGRESS
  COMPLETED
  CANCELLED
}

enum ValuationMethod {
  FIFO
  WAVG
}

# ============================================================================
# TYPES
# ============================================================================

type Item {
  id: ID!
  restaurantId: String!
  name: String!
  categoryId: String
  sku: String
  barcode: String
  allergenFlags: [String!]!
  storageType: StorageType!
  uomBase: String!
  uomDisplay: String
  yieldPct: Float
  active: Boolean!
  stockOnHand: [StockOnHand!]!
  batches: [Batch!]!
  supplierLinks: [SupplierLink!]!
  parConfigs: [ParConfig!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type StockOnHand {
  id: ID!
  itemId: String!
  locationId: String!
  restaurantId: String!
  qtyOnHandBase: Float!
  qtyCommittedBase: Float!
  qtyAvailableBase: Float!
  lastCost: Float
  avgCost: Float
  totalValue: Float
  lastMovementAt: DateTime
  item: Item!
  location: Location!
}

type Batch {
  id: ID!
  itemId: String!
  locationId: String!
  qtyOnHandBase: Float!
  expiryDate: DateTime
  lotCode: String
  supplierId: String
  lastUnitCost: Float!
  status: BatchStatus!
  item: Item!
  location: Location!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type StockLedger {
  id: ID!
  itemId: String!
  restaurantId: String!
  locationId: String!
  batchId: String
  movementType: MovementType!
  qtyBase: Float!
  uomBase: String!
  unitCost: Float
  extCost: Float
  refType: String
  refId: String
  causedBy: String!
  reason: String
  metadata: JSON
  timestamp: DateTime!
  item: Item!
  location: Location!
  batch: Batch
}

type Location {
  id: ID!
  restaurantId: String!
  name: String!
  code: String
  active: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ParConfig {
  id: ID!
  itemId: String!
  locationId: String!
  minPar: Float!
  maxPar: Float!
  reorderPoint: Float!
  reorderQty: Float!
  safetyStock: Float
  item: Item!
  location: Location!
}

type SupplierLink {
  id: ID!
  itemId: String!
  supplierId: String!
  supplierProductId: String!
  vendorUom: String!
  unitsPerVendorUom: Float!
  leadTimeDays: Int
  lastPrice: Float
  preferred: Boolean!
}

type Recipe {
  id: ID!
  restaurantId: String!
  name: String!
  description: String
  yieldUom: String!
  yieldQty: Float!
  active: Boolean!
  components: [RecipeComponent!]!
  estimatedCost: Float
  costPerYield: Float
  createdAt: DateTime!
  updatedAt: DateTime!
}

type RecipeComponent {
  id: ID!
  recipeId: String!
  itemId: String!
  qtyBase: Float!
  uomBase: String!
  wastePct: Float
  item: Item!
}

type InventoryCount {
  id: ID!
  restaurantId: String!
  locationId: String!
  countType: CountType!
  status: CountStatus!
  scheduledFor: DateTime
  startedAt: DateTime
  closedAt: DateTime
  conductedBy: String
  notes: String
  location: Location!
  lines: [InventoryCountLine!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type InventoryCountLine {
  id: ID!
  countId: String!
  itemId: String!
  systemQtyBase: Float!
  countedQtyBase: Float
  varianceQtyBase: Float
  varianceCost: Float
  note: String
  countedBy: String
  countedAt: DateTime
  item: Item!
}

type ValuationReport {
  method: ValuationMethod!
  totalValue: Float!
  itemValuations: [ItemValuation!]!
}

type ItemValuation {
  itemId: String!
  itemName: String!
  locationId: String!
  locationName: String!
  qty: Float!
  unitCost: Float!
  totalCost: Float!
}

type ReplenishmentSuggestion {
  item: Item!
  location: Location!
  qtyAvailable: Float!
  reorderPoint: Float!
  reorderQty: Float!
  qtyToOrder: Float!
  parConfig: ParConfig!
  supplierLinks: [SupplierLink!]!
}

type Alert {
  id: ID!
  restaurantId: String!
  alertType: String!
  severity: String!
  itemId: String
  locationId: String
  batchId: String
  message: String!
  metadata: JSON
  acknowledged: Boolean!
  acknowledgedBy: String
  acknowledgedAt: DateTime
  createdAt: DateTime!
}

# ============================================================================
# INPUTS
# ============================================================================

input InventoryItemFilter {
  restaurantId: String!
  active: Boolean
  categoryId: String
  storageType: StorageType
  search: String
}

input Paging {
  offset: Int
  limit: Int
}

input ReceiveStockInput {
  itemId: ID!
  locationId: ID!
  qty: Float!
  uom: String!
  unitCost: Float!
  expiryDate: DateTime
  lotCode: String
  supplierId: String
  refType: String!
  refId: String
  causedBy: String!
  reason: String
  metadata: JSON
  idempotencyKey: String
}

input IssueStockInput {
  itemId: ID!
  locationId: ID!
  qty: Float!
  uom: String!
  refType: String!
  refId: String
  causedBy: String!
  reason: String
  allowNegative: Boolean
  metadata: JSON
  idempotencyKey: String
}

input TransferStockInput {
  itemId: ID!
  fromLocationId: ID!
  toLocationId: ID!
  qty: Float!
  uom: String!
  causedBy: String!
  reason: String
  metadata: JSON
  idempotencyKey: String
}

input WasteInput {
  itemId: ID!
  locationId: ID!
  qty: Float!
  uom: String!
  causedBy: String!
  reason: String!
  metadata: JSON
  idempotencyKey: String
}

input StartCountInput {
  restaurantId: String!
  locationId: ID!
  countType: CountType!
  scheduledFor: DateTime
  conductedBy: String!
  notes: String
  itemIds: [ID!]
}

input SubmitCountLineInput {
  countId: ID!
  itemId: ID!
  countedQty: Float!
  uom: String!
  countedBy: String!
  note: String
}

input SetParInput {
  itemId: ID!
  locationId: ID!
  minPar: Float!
  maxPar: Float!
  reorderPoint: Float!
  reorderQty: Float!
  safetyStock: Float
}

input RecipeInput {
  restaurantId: String!
  name: String!
  description: String
  yieldUom: String!
  yieldQty: Float!
  components: [RecipeComponentInput!]!
}

input RecipeComponentInput {
  itemId: ID!
  qtyBase: Float!
  uomBase: String!
  wastePct: Float
}

input ProduceRecipeInput {
  recipeId: ID!
  locationId: ID!
  quantity: Float!
  causedBy: String!
  notes: String
}

# ============================================================================
# QUERY & MUTATION
# ============================================================================

type Query {
  # Items
  inventoryItems(filter: InventoryItemFilter!, paging: Paging): [Item!]!
  inventoryItem(id: ID!): Item!
  itemByBarcode(barcode: String!, restaurantId: String!): Item!
  
  # Stock
  stockOnHand(itemId: ID!, locationId: ID!): StockOnHand!
  batches(itemId: ID!, locationId: ID!): [Batch!]!
  ledger(itemId: ID!, locationId: ID, limit: Int): [StockLedger!]!
  
  # Counts
  counts(restaurantId: String!, status: CountStatus): [InventoryCount!]!
  count(id: ID!): InventoryCount!
  
  # Valuation
  valuation(restaurantId: String!, method: ValuationMethod!): ValuationReport!
  
  # Replenishment
  parSuggestions(restaurantId: String!, locationId: ID): [ReplenishmentSuggestion!]!
  
  # Recipes
  recipes(restaurantId: String!, activeOnly: Boolean): [Recipe!]!
  recipe(id: ID!): Recipe!
  recipeAvailability(recipeId: ID!, locationId: ID!): JSON!
  
  # Alerts
  alerts(restaurantId: String!, acknowledged: Boolean): [Alert!]!
}

type Mutation {
  # Movements
  receiveStock(input: ReceiveStockInput!): JSON!
  issueStock(input: IssueStockInput!): JSON!
  transferStock(input: TransferStockInput!): JSON!
  recordWaste(input: WasteInput!): JSON!
  
  # Counts
  startCount(input: StartCountInput!): JSON!
  submitCountLine(input: SubmitCountLineInput!): InventoryCountLine!
  finalizeCount(countId: ID!, conductedBy: String!, notes: String): JSON!
  
  # Par
  setParConfig(input: SetParInput!): ParConfig!
  
  # Recipes
  createRecipe(input: RecipeInput!): Recipe!
  postRecipeProduction(input: ProduceRecipeInput!): JSON!
  
  # Alerts
  acknowledgeAlert(id: ID!, acknowledgedBy: String!): Alert!
}

